[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot"
version = "0.1.0"
description = "Петрович Телеметрия: Telegram-бот для быстрого доступа к стенду (уведомления, решения, ассистент)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    # «Откуда цифра» — график PNG; выгрузка — Excel.
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
