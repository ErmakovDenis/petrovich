[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-service"
version = "0.1.0"
description = "Петрович Телеметрия: стенд ассистента (чат с LLM через OpenRouter), телеметрии и аномалий"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.12",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "ijson>=3.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleet_service = ["prompts/*.md", "store/migrations/*.py", "store/migrations/*.mako", "store/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
