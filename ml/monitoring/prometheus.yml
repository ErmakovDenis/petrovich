# Prometheus стенда (профиль monitoring в ml/docker-compose.yml): собирает /metrics fleet_service и шлюза GigaChat по
# внутренней сети compose и проверяет правила алертов alerts.yml. Alertmanager не подключён: сработавшие алерты видны в UI Prometheus
# (Alerts) и на дашборде Grafana; рассылку (почта, Telegram) настраивают отдельно.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fleet_service
    metrics_path: /metrics
    static_configs:
      - targets: ["fleet_service:8000"]
  # Запросы к GigaChat, ожидание потока и тематические отказы считает шлюз. Порт шлюза наружу не открыт.
  - job_name: gigachat_gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gigachat_gateway:8000"]
