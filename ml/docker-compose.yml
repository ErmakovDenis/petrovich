# Стенд «Петрович Телеметрия»: fleet_service (ассистент, телеметрия, аномалии и их хранилище), прокси модели
# llm_proxy (LiteLLM) и predictive_antifraud.
#   cd ml && docker compose up -d --build
# Настройки сервисов — в ml/fleet_service/.env (FS_*) и ml/predictive_antifraud/.env (PA_*), образцы в .env.example.
# Ключ X-API-Key аналитики: PA_API_KEY и FS_PREDICTIVE_API_KEY задаются одним значением.
# Порты на хосте: FLEET_SERVICE_PORT (8080) и PREDICTIVE_PORT (8001) — переменные окружения docker compose.
services:
  fleet_service:
    build: ./fleet_service
    env_file:
      - path: ./fleet_service/.env
        required: false
    ports:
      - "${FLEET_SERVICE_PORT:-8080}:8000"
    # Хранилище аномалий и решений (FS_DB_URL, SQLite-файл) — в томе: переживает перезапуск и пересборку контейнера.
    volumes:
      - fleet_data:/srv/data
      # Файл получателей писем (FS_EMAIL_RECIPIENTS_PATH=/srv/config/recipients.toml), образец — recipients.example.toml.
      - ./fleet_service/config:/srv/config:ro
    # Стенд вызывает predictive_antifraud (FS_PREDICTIVE_URL, по умолчанию http://predictive_antifraud:8000) при
    # проверке аномалий. Порядок запуска — после него, но без ожидания готовности: сбой аналитики не должен
    # останавливать чат и проверку по правилам.
    # Ассистент обращается к модели через прокси LiteLLM (повторы, запасные модели). Обойти прокси (он не стартует,
    # а чат нужен): в ml/.env строка `FS_LLM_PROXY_URL=` (пусто) и docker compose up -d — стенд пойдёт в OpenRouter
    # напрямую, без повторов.
    environment:
      FS_LLM_PROXY_URL: ${FS_LLM_PROXY_URL-http://llm_proxy:4000}
    depends_on:
      predictive_antifraud:
        condition: service_started
        required: false
      # Сбой прокси ломает только чат: телеметрия и аномалии работают и без него.
      llm_proxy:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Конфигурация прокси LiteLLM из FS_* в ml/fleet_service/.env (модель, запасные модели, повторы): пишется в том
  # llm_config при каждом запуске compose — поправили .env, перезапустите: docker compose up -d.
  llm_proxy_config:
    build: ./fleet_service
    env_file:
      - path: ./fleet_service/.env
        required: false
    command: ["python", "-m", "fleet_service.llm_proxy", "/config"]
    volumes:
      - llm_config:/config
    restart: "no"

  # Прокси LiteLLM: повторы с паузой и Retry-After, запасные модели OpenRouter. Порт наружу не открыт — к нему
  # обращается только fleet_service. Весь .env стенда стороннему образу не передаётся: окружение прокси (паузы
  # повторов и ключ OpenRouter) — в litellm.env (права 600) из тома llm_config, модели — в litellm.yaml.
  llm_proxy:
    image: ghcr.io/berriai/litellm:main-v1.83.14-stable
    entrypoint: ["sh", "-c", "set -a && . /config/litellm.env && set +a && exec litellm --config /config/litellm.yaml --port 4000"]
    volumes:
      - llm_config:/config:ro
    depends_on:
      llm_proxy_config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  predictive_antifraud:
    build: ./predictive_antifraud
    env_file:
      - path: ./predictive_antifraud/.env
        required: false
    ports:
      - "${PREDICTIVE_PORT:-8001}:8000"
    volumes:
      - ./predictive_antifraud/models:/srv/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  fleet_data:
  llm_config:
