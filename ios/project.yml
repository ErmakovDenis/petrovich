name: Petrovich
options:
  bundleIdPrefix: ru.petrovich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: "apple-generic"
    CODE_SIGN_STYLE: Automatic
targets:
  Petrovich:
    type: application
    platform: iOS
    sources:
      - path: Petrovich
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.petrovich.telemetry
        INFOPLIST_FILE: Petrovich/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        STAND_URL: "https://petrovichai.ru"
        AUTOGRAPH_BASE_URL: "https://web.tk-ekat.ru/ServiceJSON/"
    info:
      path: Petrovich/Resources/Info.plist
      properties:
        CFBundleDisplayName: Петрович
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
